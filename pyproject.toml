[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "opengwaspy"
dynamic = ["version"]
description = "Python client for the OpenGWAS Data API: GWAS summary statistics, top hits, PheWAS, variants and LD"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "OpenGWAS" }]
keywords = ["GWAS", "OpenGWAS", "summary statistics", "Mendelian randomization", "LD"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pandas>=2.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# The MCP server for AI assistants (opengwaspy-mcp).
mcp = ["mcp>=2.3,<3"]
# A Local Source: query downloaded Store Releases through ogquery (Python 3.12+).
local = ["ogquery>=0.5,<0.6; python_version >= '3.12'"]

[project.scripts]
opengwaspy-mcp = "opengwaspy.mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/opengwas/opengwaspy"
Documentation = "https://opengwas.github.io/opengwaspy/"
Issues = "https://github.com/opengwas/opengwaspy/issues"

[dependency-groups]
dev = [
    "mcp>=2.3,<3",  # the optional extra, so tests and mypy cover opengwaspy.mcp
    "mypy>=1.13",
    "ogquery>=0.5,<0.6; python_version >= '3.12'",  # the local extra, for its tests
    "pandas-stubs>=2.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.8",
    "tomli>=2.0",  # typed for mypy's Python 3.10 view of config.py
]
docs = [
    "mkdocs-material>=9.7.7",
    "mkdocstrings-python>=2.0.9",
]

[tool.hatch.version]
path = "src/opengwaspy/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src/opengwaspy", "tests", "LICENSE", "README.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "D"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
files = ["src", "tests", "examples"]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = ["ogquery", "ogquery.*"]  # read through importlib; absent before Python 3.12
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not live", "--strict-markers", "--cov=opengwaspy", "--cov-report=term-missing"]
markers = [
    "live: runs against the live API; needs OPENGWAS_URL and OPENGWAS_TOKEN (select with -m live)",
]

[tool.coverage.run]
branch = true
source = ["opengwaspy"]
# CI sets this on Python 3.10 and 3.11, where ogquery (the local extra) cannot be installed,
# so the Local Source's reader code cannot run there; it is covered on 3.12 and later.
omit = ["${OPENGWASPY_COVERAGE_OMIT-}"]

[tool.coverage.report]
fail_under = 90
show_missing = true
