[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "opengwaspy"
dynamic = ["version"]
description = "Python client for the OpenGWAS Data API: GWAS summary statistics, top hits, PheWAS, variants and LD"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "OpenGWAS" }]
keywords = ["GWAS", "OpenGWAS", "summary statistics", "Mendelian randomization", "LD"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pandas>=2.0",
]

[project.urls]
Homepage = "https://github.com/opengwas/opengwaspy"
Documentation = "https://opengwas.github.io/opengwaspy/"
Issues = "https://github.com/opengwas/opengwaspy/issues"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pandas-stubs>=2.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.8",
]

[tool.hatch.version]
path = "src/opengwaspy/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src/opengwaspy", "tests", "LICENSE", "README.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "D"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not live", "--strict-markers", "--cov=opengwaspy", "--cov-report=term-missing"]
markers = [
    "live: runs against the live API; needs OPENGWAS_URL and OPENGWAS_TOKEN (select with -m live)",
]

[tool.coverage.run]
branch = true
source = ["opengwaspy"]

[tool.coverage.report]
fail_under = 90
show_missing = true
