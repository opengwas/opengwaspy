name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy

  test:
    name: tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      # Unit tests only: the live tests need the API and a key, which CI does not have.
      - run: uv run pytest

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv build
      - name: wheel installs and imports
        run: |
          uv venv /tmp/check
          uv pip install --python /tmp/check dist/*.whl
          /tmp/check/bin/python -c "import opengwaspy; print(opengwaspy.__version__)"
      - name: the core package does not need the mcp extra
        run: |
          if /tmp/check/bin/python -c "import mcp" 2>/dev/null; then
            echo "mcp was installed without the extra"; exit 1
          fi
          /tmp/check/bin/python -c "import opengwaspy.compat, opengwaspy.jobs"
      - name: the mcp extra installs and its server starts
        run: |
          uv venv /tmp/check-mcp
          uv pip install --python /tmp/check-mcp "$(ls dist/*.whl)[mcp]"
          /tmp/check-mcp/bin/opengwaspy-mcp --version
          /tmp/check-mcp/bin/python -c "from opengwaspy.mcp import create_server; create_server()"
